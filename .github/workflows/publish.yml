name: Publish to GHCR + Docker Hub (self-hosted)

on:
  push:
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        run: docker buildx use vega-builder 2>/dev/null || docker buildx create --name vega-builder --driver docker-container --use

      - name: Check Docker Hub settings
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Set repo variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN before tagging a release."
            exit 1
          fi

      # login-action logs out automatically in its post step, so credentials never linger on the runner
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/m00grin/ph-intercept
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/ph-intercept
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7,linux/arm/v6,linux/riscv64,linux/ppc64le
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=local,src=/opt/buildx-cache/ph-intercept
          cache-to: type=local,dest=/opt/buildx-cache/ph-intercept-new,mode=max
          provenance: mode=max

      - name: Rotate build cache
        run: |
          rm -rf /opt/buildx-cache/ph-intercept
          mkdir -p /opt/buildx-cache
          mv /opt/buildx-cache/ph-intercept-new /opt/buildx-cache/ph-intercept

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          notes=$(awk '/^## \[/{if(found) exit; found=1; next} found{print}' CHANGELOG.md)
          if ! gh release view "${{ github.ref_name }}" --json id -q .id > /dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "$notes"
          fi
